name: CI

on:
  pull_request:
    # Documentation-only pull requests start no runner. No job here is a
    # required check: a path-filtered required check would stay pending and
    # block the merge. Require a check only after moving this filter into the
    # jobs, so a skipped job still reports success.
    paths:
      - '**'
      - '!README*.md'
      - '!ACKNOWLEDGMENTS*.md'
      - '!AGENTS.md'
      - '!ARCHITECTURE.md'
      - '!CHANGELOG.md'
      - '!DESIGN.md'
      - '!GLOSSARY.md'
      - '!docs/**/*.md'
      - 'docs/genui/view-format.md'
      - '!.out-of-scope/**'
      - '!.devin/**'
  # Every commit on main runs the whole suite, documentation included, and is
  # never cancelled by a newer one.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Check formatting
        run: |
          unformatted="$(find . -name '*.go' -not -path './third_party/*' -not -path './.git/*' -print0 | xargs -0 gofmt -l)"
          if [ -n "$unformatted" ]; then
            printf 'Go files need gofmt:\n%s\n' "$unformatted" >&2
            exit 1
          fi
      - run: go tool mygo vet
      - name: Cross-compile Windows host
        run: GOOS=windows GOARCH=amd64 go build ./...

  race:
    name: Race tests (${{ matrix.suite }}${{ matrix.shards && format(' {0}/{1}', matrix.shard, matrix.shards) || '' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Each long package gets a machine of its own; remaining runs every
        # package not named here, so keep its exclusions in step with the list.
        include:
          - { suite: portrait, packages: ./internal/portrait }
          - { suite: feynman, packages: ./internal/agent/feynman ./internal/nativefeynman }
          - { suite: nativeeditor, packages: ./internal/nativeeditor }
          - suite: remaining
            exclude: internal/nativeui internal/nativegenui internal/portrait internal/agent/feynman internal/nativefeynman internal/nativeeditor
          # nativeui and nativegenui are the longest packages; their tests split
          # across machines round-robin, so each shard gets a share of the slow
          # ones.
          - { suite: nativeui, shard: 1, shards: 5 }
          - { suite: nativeui, shard: 2, shards: 5 }
          - { suite: nativeui, shard: 3, shards: 5 }
          - { suite: nativeui, shard: 4, shards: 5 }
          - { suite: nativeui, shard: 5, shards: 5 }
          - { suite: nativegenui, shard: 1, shards: 2 }
          - { suite: nativegenui, shard: 2, shards: 2 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run race tests
        shell: bash
        env:
          SUITE: ${{ matrix.suite }}
          PACKAGES: ${{ matrix.packages }}
          EXCLUDE: ${{ matrix.exclude }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
        run: |
          if [[ -n "$EXCLUDE" ]]; then
            module="$(go list -m)"
            excluded=()
            for pkg in $EXCLUDE; do excluded+=(-e "$module/$pkg"); done
            mapfile -t packages < <(go list ./... | grep -Fxv "${excluded[@]}")
            go test -race "${packages[@]}"
          elif [[ -n "$PACKAGES" ]]; then
            # shellcheck disable=SC2086 # PACKAGES is a space-separated list.
            go test -race $PACKAGES
          else
            # Listing with -race builds the same test binary the run reuses.
            mine="$(go test -race -list '.*' "./internal/$SUITE" | grep -E '^(Test|Example|Fuzz)' |
              awk -v n="$SHARDS" -v k="$SHARD" '(NR - 1) % n == k - 1' | paste -sd '|' -)"
            echo "shard $SHARD/$SHARDS runs $(tr '|' '\n' <<< "$mine" | wc -l) tests"
            go test -race -run "^($mine)\$" "./internal/$SUITE"
          fi
