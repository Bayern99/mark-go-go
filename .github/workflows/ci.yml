name: CI

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: DEBUG-b7c1 loop
        run: |
          mkdir -p /tmp/dbg
          DEBUG_A4F2_DIR=/tmp/dbg go test -race -count=1 -v -run 'TestDEBUGb7c1Code|TestTextInlineCodeUsesPortraitMonoAtTwelvePoints' ./internal/nativegenui/ 2>&1 | tee /tmp/dbg/log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-b7c1
          path: /tmp/dbg
