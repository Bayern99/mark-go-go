name: CI

on:
  pull_request:
    # Documentation-only pull requests start no runner. No job here is a
    # required check: a path-filtered required check would stay pending and
    # block the merge. Require a check only after moving this filter into the
    # jobs, so a skipped job still reports success.
    paths:
      - '**'
      - '!README*.md'
      - '!ACKNOWLEDGMENTS*.md'
      - '!AGENTS.md'
      - '!ARCHITECTURE.md'
      - '!CHANGELOG.md'
      - '!DESIGN.md'
      - '!GLOSSARY.md'
      - '!docs/**/*.md'
      - 'docs/genui/view-format.md'
      - '!.out-of-scope/**'
      - '!.devin/**'
  # Every commit on main runs the whole suite, documentation included, and is
  # never cancelled by a newer one.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Check formatting
        run: |
          unformatted="$(find . -name '*.go' -not -path './third_party/*' -not -path './.git/*' -print0 | xargs -0 gofmt -l)"
          if [ -n "$unformatted" ]; then
            printf 'Go files need gofmt:\n%s\n' "$unformatted" >&2
            exit 1
          fi
      - run: go tool mygo vet
      - name: Cross-compile Windows host
        run: GOOS=windows GOARCH=amd64 go build ./...

  race:
    name: Race tests (${{ matrix.suite }}${{ matrix.shards && format(' {0}/{1}', matrix.shard, matrix.shards) || '' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [nativegenui, portrait, remaining]
        # nativeui is the longest package by far; its tests split across
        # machines round-robin, so each shard gets a share of the slow ones.
        include:
          - { suite: nativeui, shard: 1, shards: 3 }
          - { suite: nativeui, shard: 2, shards: 3 }
          - { suite: nativeui, shard: 3, shards: 3 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run race tests
        shell: bash
        env:
          SUITE: ${{ matrix.suite }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
        run: |
          if [[ "$SUITE" == remaining ]]; then
            module="$(go list -m)"
            selected="$(go list ./... | grep -Fxv \
              -e "$module/internal/nativegenui" \
              -e "$module/internal/nativeui" \
              -e "$module/internal/portrait")"
            mapfile -t packages <<< "$selected"
            go test -race "${packages[@]}"
          elif [[ -n "$SHARDS" ]]; then
            # Listing with -race builds the same test binary the run reuses.
            mine="$(go test -race -list '.*' "./internal/$SUITE" | grep -E '^(Test|Example|Fuzz)' |
              awk -v n="$SHARDS" -v k="$SHARD" '(NR - 1) % n == k - 1' | paste -sd '|' -)"
            echo "shard $SHARD/$SHARDS runs $(tr '|' '\n' <<< "$mine" | wc -l) tests"
            go test -race -run "^($mine)\$" "./internal/$SUITE"
          else
            go test -race "./internal/$SUITE"
          fi
