<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <rect width="640" height="320" fill="#ffffff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#222">Figure 1. Retrieval accuracy vs. context length</text>
  <line x1="70" y1="270" x2="600" y2="270" stroke="#333" stroke-width="1"/>
  <line x1="70" y1="270" x2="70" y2="50" stroke="#333" stroke-width="1"/>
  <g font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555">
    <text x="60" y="274" text-anchor="end">0</text>
    <text x="60" y="230" text-anchor="end">25</text>
    <text x="60" y="186" text-anchor="end">50</text>
    <text x="60" y="142" text-anchor="end">75</text>
    <text x="60" y="98" text-anchor="end">100</text>
    <text x="110" y="286" text-anchor="middle">4k</text>
    <text x="230" y="286" text-anchor="middle">16k</text>
    <text x="350" y="286" text-anchor="middle">64k</text>
    <text x="470" y="286" text-anchor="middle">256k</text>
    <text x="580" y="286" text-anchor="middle">1M</text>
  </g>
  <g stroke="#ddd" stroke-width="1">
    <line x1="70" y1="226" x2="600" y2="226"/>
    <line x1="70" y1="182" x2="600" y2="182"/>
    <line x1="70" y1="138" x2="600" y2="138"/>
    <line x1="70" y1="94" x2="600" y2="94"/>
  </g>
  <polyline points="110,88 230,96 350,112 470,158 580,224" fill="none" stroke="#1f6feb" stroke-width="2"/>
  <polyline points="110,92 230,104 350,120 470,150 580,196" fill="none" stroke="#d4351c" stroke-width="2" stroke-dasharray="6 4"/>
  <g fill="#1f6feb">
    <circle cx="110" cy="88" r="3"/><circle cx="230" cy="96" r="3"/><circle cx="350" cy="112" r="3"/><circle cx="470" cy="158" r="3"/><circle cx="580" cy="224" r="3"/>
  </g>
  <g fill="#d4351c">
    <circle cx="110" cy="92" r="3"/><circle cx="230" cy="104" r="3"/><circle cx="350" cy="120" r="3"/><circle cx="470" cy="150" r="3"/><circle cx="580" cy="196" r="3"/>
  </g>
  <rect x="380" y="52" width="210" height="40" fill="#fff" stroke="#ccc"/>
  <line x1="392" y1="64" x2="420" y2="64" stroke="#1f6feb" stroke-width="2"/>
  <text x="428" y="68" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333">sparse attention</text>
  <line x1="392" y1="84" x2="420" y2="84" stroke="#d4351c" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="428" y="88" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333">dense attention</text>
  <text x="335" y="306" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333">context length (tokens)</text>
  <text x="20" y="160" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333" transform="rotate(-90 20 160)" text-anchor="middle">accuracy (%)</text>
</svg>
